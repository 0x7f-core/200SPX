<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>A Godly Investor's True Quest</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #121214;
      --card-border: #1e1e22;
      --p1: #FFFFFF;
      --p2: #8E8E93;
      --dot: #636366;
      --slash: #FFFFFF;
      --divider: #2C2C2E;
      --tqqq: #E8714F;
      --spym: #B07CC0;
      --sgov: #5BB8E8;
      --upperBand: #E070C0;
      --lowerBand: #AFD485;
      --cp: #80DFFF;
      --alert: #FF453A;
      --extremeFear: #E8714F;
      --fear: #F0A0A0;
      --neutral: #8E8E93;
      --greed: #5BB8E8;
      --extremeGreed: #B07CC0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--p1);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Pretendard", system-ui, sans-serif;
      padding: calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom)) 10px;
      width: 100%;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .widget-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      width: 100%;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 14px 16px;
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 2px;
    }

    .title {
      font-size: clamp(15px, 4.2vw, 18px);
      font-weight: 700;
      letter-spacing: -0.4px;
      text-decoration: none;
      color: var(--p1);
    }

    .version {
      font-size: clamp(9px, 2.5vw, 11px);
      color: var(--p2);
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .updated-time {
      font-size: clamp(10px, 2.8vw, 12px);
      color: var(--p1);
      margin-bottom: 10px;
      opacity: 0.85;
      font-weight: 400;
    }

    .content-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
    }

    .chart-box {
      flex: 1.05;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .info-box {
      flex: 1.15;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
    }

    .sig-row {
      font-size: clamp(13px, 3.8vw, 16px);
      font-weight: 700;
      line-height: 1.25;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
    }

    .token-tqqq { color: var(--tqqq); }
    .token-spym { color: var(--spym); }
    .token-sgov { color: var(--sgov); }
    .token-dot  { color: var(--dot); margin: 0 1px; }
    .token-action { color: var(--p1); margin-left: 4px; }
    .token-alert  { color: var(--alert); }

    .status-text {
      font-size: clamp(10px, 2.8vw, 12px);
      margin-top: 2px;
      font-weight: 600;
    }

    .dd-text {
      font-size: clamp(11px, 3vw, 13px);
      font-weight: 600;
      color: var(--p1);
      margin-top: 2px;
    }

    .fgi-header {
      font-size: clamp(15px, 4.2vw, 18px);
      font-weight: 700;
      margin-bottom: 8px;
      text-decoration: none;
      color: var(--p1);
      display: inline-block;
      letter-spacing: -0.4px;
    }

    .fgi-info-box {
      flex: 1.15;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .fgi-rating {
      font-size: clamp(13px, 3.8vw, 16px);
      font-weight: 700;
      margin-top: -2px;
    }

    .fgi-stats {
      font-size: clamp(11px, 3.2vw, 14px);
      font-weight: 600;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .fgi-slash {
      color: var(--slash);
      font-weight: 700;
    }

    .loading-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 60vh;
      color: var(--p2);
      font-size: 14px;
      font-weight: 500;
    }

    .refresh-btn {
      width: 100%;
      background: #1C1C1E;
      border: 1px solid var(--divider);
      color: var(--p1);
      padding: 13px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 4px;
      cursor: pointer;
      transition: background 0.15s ease, opacity 0.15s ease;
    }
    .refresh-btn:active {
      background: #2C2C2E;
      opacity: 0.8;
    }
    .refresh-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div id="loader" class="loading-wrap">실시간 지표 동기화 중...</div>

  <div id="main-view" class="widget-container" style="display: none;">
    <!-- Large 위젯: 200슨피단 (SPX) -->
    <div class="card" id="card-spx">
      <div class="card-header">
        <a class="title" href="https://www.youtube.com/@%EC%95%84%EA%B8%B0%ED%8B%B0%ED%81%90" target="_blank">아기티큐 200슨피단 (SPX)</a>
        <div class="version" id="spx-ver">v3.0-γ</div>
      </div>
      <div class="updated-time" id="spx-updated">-</div>
      
      <div class="content-row">
        <div class="chart-box">
          <canvas id="spxChart"></canvas>
        </div>
        <div class="info-box" id="spx-info"></div>
      </div>
    </div>

    <!-- Medium 위젯: 200큐큐단 (QQQ) -->
    <div class="card" id="card-qqq">
      <div class="card-header">
        <a class="title" href="https://www.youtube.com/@%EC%95%84%EA%B8%B0%ED%8B%B0%ED%81%90" target="_blank">아기티큐 200큐큐단 (QQQ)</a>
        <div class="version" id="qqq-ver">v3.0-γ</div>
      </div>
      <div class="updated-time" id="qqq-updated">-</div>
      
      <div class="content-row">
        <div class="chart-box">
          <canvas id="qqqChart"></canvas>
        </div>
        <div class="info-box" id="qqq-info"></div>
      </div>
    </div>

    <!-- 공포와 탐욕 지수 (CNN FGI) -->
    <div class="card" id="card-fgi">
      <a class="fgi-header" href="https://edition.cnn.com/markets/fear-and-greed" target="_blank">공포와 탐욕 지수 (CNN FGI)</a>
      <div class="content-row">
        <div class="chart-box">
          <canvas id="fgiHistoryChart"></canvas>
        </div>
        <div class="fgi-info-box">
          <canvas id="fgiGauge"></canvas>
          <div class="fgi-rating" id="fgi-rating-text">-</div>
          <div class="fgi-stats" id="fgi-stats-text"></div>
        </div>
      </div>
    </div>

    <button class="refresh-btn" id="btn-refresh" onclick="loadDashboard()">새로고침</button>
  </div>

  <script>
    const WORKER_URL = "https://spx-indicator-api.jinwook0904.workers.dev";

    const C = {
      p1: "#FFFFFF",
      p2: "#8E8E93",
      dot: "#636366",
      slash: "#FFFFFF",
      divider: "#2C2C2E",
      upperBand: "#E070C0",
      lowerBand: "#AFD485",
      cp: "#80DFFF",
      alert: "#FF453A",
      extremeFear: "#E8714F",
      fear: "#F0A0A0",
      neutral: "#8E8E93",
      greed: "#5BB8E8",
      extremeGreed: "#B07CC0",
      tqqq: "#E8714F",
      spym: "#B07CC0",
      sgov: "#5BB8E8"
    };

    // Retina 디스플레이 대응 Canvas Context 초기화 (선명도 극대화)
    function getHDContext(canvasId, logicalW, logicalH) {
      const cvs = document.getElementById(canvasId);
      if (!cvs) return null;
      const dpr = window.devicePixelRatio || 1;
      cvs.width = logicalW * dpr;
      cvs.height = logicalH * dpr;
      cvs.style.aspectRatio = `${logicalW} / ${logicalH}`;
      const ctx = cvs.getContext("2d");
      ctx.resetTransform?.();
      ctx.scale(dpr, dpr);
      return { ctx, W: logicalW, H: logicalH };
    }

    function etfColorClass(token) {
      if (token.includes("TQQQ")) return "token-tqqq";
      if (token.includes("SPYM")) return "token-spym";
      if (token.includes("SGOV")) return "token-sgov";
      return "";
    }

    function fgiColor(val) {
      if (val >= 75) return C.extremeGreed;
      if (val >= 55) return C.greed;
      if (val >= 45) return C.neutral;
      if (val >= 25) return C.fear;
      return C.extremeFear;
    }

    function translateRating(rating) {
      const r = (rating || "").toLowerCase();
      if (r === "extreme fear")  return "극공포 (Extreme Fear)";
      if (r === "fear")          return "공포 (Fear)";
      if (r === "neutral")       return "중립 (Neutral)";
      if (r === "greed")         return "탐욕 (Greed)";
      if (r === "extreme greed") return "극탐욕 (Extreme Greed)";
      return rating;
    }

    function drawBandChart(canvasId, closes, sma, upB, dnB) {
      const cv = getHDContext(canvasId, 500, 300);
      if (!cv) return;
      const { ctx, W, H } = cv;

      const SIZE = 90;
      const pSet = closes.slice(-SIZE);
      const sSet = sma.slice(-SIZE);
      const uSet = sSet.map(v => v === null ? NaN : v * (1 + upB));
      const lSet = sSet.map(v => v === null ? NaN : v * (1 - dnB));

      const all = pSet.concat(uSet, lSet).filter(v => !isNaN(v));
      const min = Math.min(...all), max = Math.max(...all);
      const range = (max - min) === 0 ? 1 : (max - min);

      const trans = (v, i) => ({
        x: 15 + (i / (SIZE - 1)) * (W - 30),
        y: (H - 15) - ((v - min) / range) * (H - 30),
      });

      const plot = (dat, col, wid) => {
        ctx.beginPath();
        let started = false;
        for (let i = 0; i < dat.length; i++) {
          const pt = dat[i];
          if (!isNaN(pt.y)) {
            if (!started) { ctx.moveTo(pt.x, pt.y); started = true; }
            else ctx.lineTo(pt.x, pt.y);
          }
        }
        ctx.strokeStyle = col;
        ctx.lineWidth = wid;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.stroke();
      };

      plot(uSet.map(trans), C.upperBand, 3.5);
      plot(lSet.map(trans), C.lowerBand, 3.5);
      plot(pSet.map(trans), C.cp, 5.5);
    }

    function drawFGIChart(canvasId, data) {
      const cv = getHDContext(canvasId, 480, 300);
      if (!cv) return;
      const { ctx, W, H } = cv;

      const PAD_L = 12, PAD_R = 12, PAD_T = 20, PAD_B = 20;
      const usableW = W - PAD_L - PAD_R, usableH = H - PAD_T - PAD_B;
      const toY = (v) => PAD_T + (1 - v / 100) * usableH;
      const toX = (i) => PAD_L + (i / (data.length - 1)) * usableW;

      // 기준선
      [25, 50, 75].forEach(lvl => {
        ctx.beginPath();
        ctx.moveTo(PAD_L, toY(lvl));
        ctx.lineTo(W - PAD_R, toY(lvl));
        ctx.strokeStyle = "rgba(142, 142, 147, 0.25)";
        ctx.lineWidth = 1.2;
        ctx.stroke();
      });

      // 추세선
      ctx.beginPath();
      data.forEach((d, i) => {
        const x = toX(i), y = toY(parseFloat(d.y));
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // 포인트
      data.forEach((d, i) => {
        const x = toX(i), y = toY(parseFloat(d.y));
        ctx.fillStyle = fgiColor(parseFloat(d.y));
        ctx.beginPath();
        ctx.arc(x, y, 4.5, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawGauge(canvasId, val) {
      const cv = getHDContext(canvasId, 360, 210);
      if (!cv) return;
      const { ctx, W, H } = cv;

      const cx = W / 2, cy = H - 25, radius = 130, arcThick = 11;

      for (let i = 0; i < 120; i++) {
        const t = i / 119;
        const angle = Math.PI + t * Math.PI;
        const x = cx + Math.cos(angle) * radius;
        const y = cy + Math.sin(angle) * radius;
        ctx.fillStyle = fgiColor(t * 100);
        ctx.beginPath();
        ctx.arc(x, y, arcThick / 2, 0, Math.PI * 2);
        ctx.fill();
      }

      const needleAngle = Math.PI + (val / 100) * Math.PI;
      const needleLen = radius - 8;
      const nx = cx + Math.cos(needleAngle) * needleLen;
      const ny = cy + Math.sin(needleAngle) * needleLen;

      ctx.strokeStyle = C.p1;
      ctx.lineWidth = 4.5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(nx, ny);
      ctx.stroke();

      ctx.fillStyle = C.p1;
      ctx.beginPath();
      ctx.arc(cx, cy, 8, 0, Math.PI * 2);
      ctx.fill();

      const labelDist = radius + 25;
      const lx = cx + Math.cos(needleAngle) * labelDist;
      const ly = cy + Math.sin(needleAngle) * labelDist;

      ctx.fillStyle = C.p1;
      ctx.font = "bold 24px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(val.toFixed(0), lx, ly);
    }

    function renderTokens(containerId, sig) {
      const el = document.getElementById(containerId);
      if (!el || !sig) return;

      const rowsHtml = (sig.lines || []).map(pair => {
        const [tokenWord, actionWord] = pair;
        let tokensHtml = "";

        if (sig.isAlert) {
          tokensHtml = `<span class="token-alert">${tokenWord}</span>`;
        } else if (tokenWord.includes("·")) {
          tokensHtml = tokenWord.split("·").map(p => 
            `<span class="${etfColorClass(p)}">${p}</span>`
          ).join('<span class="token-dot">·</span>');
        } else {
          tokensHtml = `<span class="${etfColorClass(tokenWord)}">${tokenWord}</span>`;
        }

        return `
          <div class="sig-row">
            ${tokensHtml}
            <span class="token-action">${actionWord}</span>
          </div>
        `;
      }).join("");

      el.innerHTML = `
        ${rowsHtml}
        <div class="status-text" style="color: ${sig.isAlert ? C.alert : C.p2}">${sig.n}</div>
        <div class="dd-text">${sig.ddStr}</div>
      `;
    }

    function applyViewFilter() {
      const urlParams = new URLSearchParams(window.location.search);
      const view = urlParams.get('v');

      const cardSpx = document.getElementById('card-spx');
      const cardQqq = document.getElementById('card-qqq');
      const cardFgi = document.getElementById('card-fgi');
      const btnRefresh = document.getElementById('btn-refresh');

      if (view === 'spx') {
        cardQqq.style.display = 'none';
        cardFgi.style.display = 'none';
        btnRefresh.style.display = 'none';
      } else if (view === 'qqq') {
        cardSpx.style.display = 'none';
        cardFgi.style.display = 'none';
        btnRefresh.style.display = 'none';
      } else if (view === 'fgi') {
        cardSpx.style.display = 'none';
        cardQqq.style.display = 'none';
        btnRefresh.style.display = 'none';
      }
    }

    async function loadDashboard() {
      const loader = document.getElementById("loader");
      const mainView = document.getElementById("main-view");
      const btnRefresh = document.getElementById("btn-refresh");

      if (btnRefresh) btnRefresh.disabled = true;

      try {
        const res = await fetch(WORKER_URL);
        if (!res.ok) throw new Error("데이터를 가져올 수 없습니다.");
        const data = await res.json();

        const formatKst = (ts) => {
          const d = new Date(ts * 1000);
          return new Intl.DateTimeFormat('ko-KR', {
            timeZone: 'Asia/Seoul',
            year: '2-digit', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', hour12: false
          }).format(d).replace(/\. /g, '.').replace(/\.$/, '') + ' 기준';
        };

        if (data.version) {
          document.getElementById("spx-ver").innerText = data.version;
          document.getElementById("qqq-ver").innerText = data.version;
        }

        document.getElementById("spx-updated").innerText = formatKst(data.spxTime);
        document.getElementById("qqq-updated").innerText = formatKst(data.qqqTime);

        drawBandChart("spxChart", data.spx.closes, data.spx.sma, data.spx.upB, data.spx.dnB);
        renderTokens("spx-info", data.spx.sig);

        drawBandChart("qqqChart", data.qqq.closes, data.qqq.sma, data.qqq.upB, data.qqq.dnB);
        renderTokens("qqq-info", data.qqq.sig);

        drawFGIChart("fgiHistoryChart", data.fgi.data);
        drawGauge("fgiGauge", data.fgi.latestVal);

        const ratingEl = document.getElementById("fgi-rating-text");
        ratingEl.innerText = translateRating(data.fgi.latestRating);
        ratingEl.style.color = fgiColor(data.fgi.latestVal);

        const statsEl = document.getElementById("fgi-stats-text");
        statsEl.innerHTML = `
          <span style="color: ${fgiColor(data.fgi.latestVal)}">현재 ${data.fgi.latestVal.toFixed(0)}</span>
          <span class="fgi-slash">/</span>
          <span style="color: ${fgiColor(data.fgi.avg30)}">30일 평균 ${data.fgi.avg30.toFixed(0)}</span>
        `;

        applyViewFilter();

        loader.style.display = "none";
        mainView.style.display = "flex";
      } catch (err) {
        loader.innerText = "오류: " + err.message;
      } finally {
        if (btnRefresh) btnRefresh.disabled = false;
      }
    }

    loadDashboard();
  </script>
</body>
</html>
