<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>A Godly Investor's True Quest</title>
  <style>
    /* =============================================================================
       A Godly Investor's True Quest (Multi-Version Hub & Widget)
       "사람이 마음으로 자기의 길을 계획할지라도 그의 걸음을 인도하시는 이는 여호와시니라" (잠언 16장 9절)
       ============================================================================= */
    :root {
      --bg: #000000;
      --card-bg: #000000;
      --card-border: #1c1c1e;
      --p1: #FFFFFF;
      --p2: #888888;
      --status-p: #9a9aa0;
      --dot: #666666;
      --slash: #FFFFFF;
      --divider: #333333;

      --tqqq: #e8714f;
      --spym: #b07cc0;
      --sgov: #5bb8e8;
      --ma: #afd485;
      --cp: #80dfff;
      --upperBand: #e070c0;
      --lowerBand: #afd485;
      --alert: #ff4d4d;

      --extremeFear: #e8714f;
      --fear: #f0a0a0;
      --neutral: #AAAAAA;
      --greed: #5bb8e8;
      --extremeGreed: #b07cc0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg);
    }

    body {
      color: var(--p1);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "SF Pro Display", "SF Pro Text", "Pretendard", "Roboto", "Helvetica Neue", sans-serif;
      padding: calc(14px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom)) 14px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      user-select: none;
      display: flex;
      justify-content: center;
    }

    /* 웹/앱 메인 대시보드 컨테이너 */
    .widget-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 0 auto;
    }

    .card {
      width: 100%;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 14px 16px;
      border: 1px solid var(--card-border);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 2px;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      color: var(--p1);
      letter-spacing: -0.4px;
    }

    .version {
      font-size: 9.5px;
      color: var(--p2);
      font-weight: 400;
    }

    .updated-time {
      font-size: 10.5px;
      color: var(--p1);
      margin-bottom: 8px;
      font-weight: 400;
      letter-spacing: -0.2px;
    }

    .content-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
    }

    .chart-box {
      flex: 1.15;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .info-box {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      padding-left: 4px;
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    .sig-row {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.25;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      letter-spacing: -0.2px;
    }

    .token-tqqq { color: var(--tqqq); }
    .token-spym { color: var(--spym); }
    .token-sgov { color: var(--sgov); }
    .token-dot  { color: var(--dot); margin: 0 1px; }
    .token-action { color: var(--p1); margin-left: 6px; font-weight: 700; }
    .token-alert  { color: var(--alert); }

    .status-text {
      font-size: 10.5px;
      color: var(--status-p);
      margin-top: 3px;
      font-weight: 400;
      letter-spacing: -0.2px;
    }

    .dd-text {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--p1);
      margin-top: 4px;
      letter-spacing: -0.2px;
    }

    .fgi-header {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
      text-decoration: none;
      color: var(--p1);
      display: inline-block;
      letter-spacing: -0.4px;
    }

    .fgi-info-box {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 3px;
    }

    .fgi-rating {
      font-size: 15px;
      font-weight: 700;
      margin-top: 2px;
      letter-spacing: -0.2px;
    }

    .fgi-stats {
      font-size: 13px;
      font-weight: 500;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      letter-spacing: -0.2px;
    }

    .fgi-slash {
      color: var(--slash);
      font-weight: 700;
    }

    .loading-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 70vh;
      color: var(--p2);
      font-size: 13px;
      font-weight: 500;
    }

    .refresh-btn {
      width: 100%;
      background: #141416;
      border: 1px solid var(--divider);
      color: var(--p2);
      padding: 13px;
      border-radius: 16px;
      font-size: 13.5px;
      font-weight: 600;
      margin-top: 4px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      letter-spacing: -0.2px;
    }
    .refresh-btn:active {
      background: #222226;
      color: var(--p1);
    }

    /* =============================================================================
       안드로이드 홈 화면 위젯 전용 뷰포트 스타일 (?v=spx, ?v=qqq, ?v=fgi)
       ============================================================================= */
    body.is-widget {
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      margin: 0;
      padding: 2.2vh 2.6vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-sizing: border-box;
      background: #000000;
    }

    body.is-widget .widget-container {
      width: 100%;
      height: 100%;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    body.is-widget .card {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2.8vh 3.2vw 2.2vh 3.2vw;
      border-radius: 20px;
      border: 1px solid #1c1c1e;
      background: #000000;
      box-sizing: border-box;
    }

    body.is-widget .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.2vh;
    }

    body.is-widget .title,
    body.is-widget .fgi-header {
      font-size: min(4.6vw, 9.6vh) !important;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: #FFFFFF;
      line-height: 1.1;
    }

    body.is-widget .version {
      font-size: min(2.7vw, 5.6vh) !important;
      color: #7c7c80;
      line-height: 1;
    }

    body.is-widget .updated-time {
      font-size: min(3.0vw, 6.4vh) !important;
      margin-bottom: 0.8vh;
      color: #FFFFFF;
      line-height: 1.1;
    }

    body.is-widget .content-row {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2.5vw;
      min-height: 0;
      width: 100%;
    }

    body.is-widget .chart-box {
      flex: 1.25;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    body.is-widget .chart-box canvas {
      max-height: 100%;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    body.is-widget .info-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.6vh;
      min-width: 0;
      padding-left: 0.5vw;
    }

    body.is-widget .sig-row {
      font-size: min(4.8vw, 10.0vh) !important;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      letter-spacing: -0.3px;
    }

    body.is-widget .token-action {
      margin-left: 1.2vw;
      color: #FFFFFF;
      font-weight: 700;
    }

    body.is-widget .status-text {
      font-size: min(3.2vw, 6.6vh) !important;
      color: #9a9aa0;
      margin-top: 0.4vh;
      white-space: nowrap;
      letter-spacing: -0.2px;
    }

    body.is-widget .dd-text {
      font-size: min(3.6vw, 7.8vh) !important;
      font-weight: 700;
      color: #FFFFFF;
      margin-top: 0.5vh;
      white-space: nowrap;
      letter-spacing: -0.2px;
    }

    body.is-widget .fgi-info-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6vh;
      min-width: 0;
    }

    body.is-widget .fgi-rating {
      font-size: min(4.6vw, 9.6vh) !important;
      font-weight: 700;
      margin-top: 0.4vh;
      white-space: nowrap;
    }

    body.is-widget .fgi-stats {
      font-size: min(3.6vw, 7.6vh) !important;
      gap: 1.5vw;
      white-space: nowrap;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div id="loader" class="loading-wrap">동기화된 지표를 불러오는 중...</div>

  <div id="main-view" class="widget-container" style="display: none;">
    <!-- Large: 200슨피단 (SPX ±2.5% 밴드 + V2 다회성 TS) -->
    <div class="card" id="card-spx">
      <div class="card-header">
        <a class="title" href="https://www.youtube.com/@%EC%95%84%EA%B8%B0%ED%8B%B0%ED%81%90" target="_blank">아기티큐 200슨피단 (SPX)</a>
        <div class="version" id="spx-ver">v3.0-γ (26.08.12)</div>
      </div>
      <div class="updated-time" id="spx-updated">-</div>
      
      <div class="content-row">
        <div class="chart-box">
          <canvas id="spxChart"></canvas>
        </div>
        <div class="info-box" id="spx-info"></div>
      </div>
    </div>

    <!-- Medium: 200큐큐단 (QQQ ±2.0% 밴드 + 1회성 TS) -->
    <div class="card" id="card-qqq">
      <div class="card-header">
        <a class="title" href="https://www.youtube.com/@%EC%95%84%EA%B8%B0%ED%8B%B0%ED%81%90" target="_blank">아기티큐 200큐큐단 (QQQ)</a>
        <div class="version" id="qqq-ver">v3.0-γ (26.08.12)</div>
      </div>
      <div class="updated-time" id="qqq-updated">-</div>
      
      <div class="content-row">
        <div class="chart-box">
          <canvas id="qqqChart"></canvas>
        </div>
        <div class="info-box" id="qqq-info"></div>
      </div>
    </div>

    <!-- 공포와 탐욕 지수 (CNN FGI) -->
    <div class="card" id="card-fgi">
      <a class="fgi-header" href="https://edition.cnn.com/markets/fear-and-greed" target="_blank">공포와 탐욕 지수 (CNN FGI)</a>
      <div class="content-row">
        <div class="chart-box">
          <canvas id="fgiHistoryChart"></canvas>
        </div>
        <div class="fgi-info-box">
          <canvas id="fgiGauge"></canvas>
          <div class="fgi-rating" id="fgi-rating-text">-</div>
          <div class="fgi-stats" id="fgi-stats-text"></div>
        </div>
      </div>
    </div>

    <button class="refresh-btn" id="btn-refresh" onclick="loadDashboard()">새로고침</button>
  </div>

  <script>
    const WORKER_URL = "https://spx-indicator-api.jinwook0904.workers.dev";

    // iOS Scriptable C 팔레트와 1:1 일치
    const C = {
      bg: "#000000",
      p1: "#FFFFFF",
      p2: "#AAAAAA",
      statusP: "#9a9aa0",
      dot: "#666666",
      slash: "#FFFFFF",
      divider: "#333333",

      tqqq: "#e8714f",
      spym: "#b07cc0",
      sgov: "#5bb8e8",
      ma: "#afd485",
      cp: "#80dfff",
      upperBand: "#e070c0",
      lowerBand: "#afd485",
      alert: "#ff4d4d",

      extremeFear: "#e8714f",
      fear: "#f0a0a0",
      neutral: "#AAAAAA",
      greed: "#5bb8e8",
      extremeGreed: "#b07cc0"
    };

    // 3배 슈퍼샘플링 초고화질 캔버스 컨텍스트
    function getHDContext(canvasId, logicalW, logicalH) {
      const cvs = document.getElementById(canvasId);
      if (!cvs) return null;
      const dpr = window.devicePixelRatio && window.devicePixelRatio > 2 ? window.devicePixelRatio : 3;
      cvs.width = logicalW * dpr;
      cvs.height = logicalH * dpr;
      cvs.style.aspectRatio = `${logicalW} / ${logicalH}`;
      const ctx = cvs.getContext("2d");
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.resetTransform?.();
      ctx.scale(dpr, dpr);
      return { ctx, W: logicalW, H: logicalH };
    }

    function etfColorClass(token) {
      if (token.includes("TQQQ")) return "token-tqqq";
      if (token.includes("SPYM")) return "token-spym";
      if (token.includes("SGOV")) return "token-sgov";
      return "";
    }

    function fgiColor(val) {
      if (val >= 75) return C.extremeGreed;
      if (val >= 55) return C.greed;
      if (val >= 45) return C.neutral;
      if (val >= 25) return C.fear;
      return C.extremeFear;
    }

    function translateRating(rating) {
      switch ((rating || "").toLowerCase()) {
        case "extreme fear":  return "극공포 (Extreme Fear)";
        case "fear":          return "공포 (Fear)";
        case "neutral":       return "중립 (Neutral)";
        case "greed":         return "탐욕 (Greed)";
        case "extreme greed": return "극탐욕 (Extreme Greed)";
        default:              return rating;
      }
    }

    // Scriptable drawBandChart 1:1 완벽 구현
    function drawBandChart(canvasId, closes, sma, upB, dnB) {
      const W = 540, H = 260;
      const cv = getHDContext(canvasId, W, H);
      if (!cv) return;
      const { ctx } = cv;

      const SIZE = 90;
      const pSet = closes.slice(-SIZE);
      const sSet = sma.slice(-SIZE);
      const uSet = sSet.map(v => isNaN(v) ? NaN : v * (1 + upB));
      const lSet = sSet.map(v => isNaN(v) ? NaN : v * (1 - dnB));

      const all = pSet.concat(uSet).concat(lSet).filter(v => !isNaN(v));
      const min = Math.min(...all);
      const max = Math.max(...all);
      const range = (max - min) === 0 ? 1 : (max - min);

      const trans = (v, i) => ({
        x: 8 + (i / (SIZE - 1)) * (W - 16),
        y: (H - 8) - ((v - min) / range) * (H - 16),
      });

      const plot = (dat, col, wid) => {
        ctx.beginPath();
        let started = false;
        dat.forEach(pt => {
          if (!isNaN(pt.y)) {
            if (!started) { ctx.moveTo(pt.x, pt.y); started = true; }
            else ctx.lineTo(pt.x, pt.y);
          }
        });
        ctx.strokeStyle = col;
        ctx.lineWidth = wid;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.stroke();
      };

      plot(uSet.map(trans), C.upperBand, 3.8);
      plot(lSet.map(trans), C.lowerBand, 3.8);
      plot(pSet.map(trans), C.cp, 6.0);
    }

    // Scriptable drawFGIChart 1:1 완벽 구현
    function drawFGIChart(canvasId, data) {
      const W = 540, H = 260;
      const cv = getHDContext(canvasId, W, H);
      if (!cv) return;
      const { ctx, W: cW, H: cH } = cv;

      const PAD_L = 6, PAD_R = 6, PAD_T = 10, PAD_B = 10;
      const usableW = cW - PAD_L - PAD_R;
      const usableH = cH - PAD_T - PAD_B;
      const toY = (val) => PAD_T + (1 - val / 100) * usableH;
      const toX = (i) => PAD_L + (i / (data.length - 1)) * usableW;

      [25, 50, 75].forEach(level => {
        ctx.beginPath();
        ctx.moveTo(PAD_L, toY(level));
        ctx.lineTo(cW - PAD_R, toY(level));
        ctx.strokeStyle = "rgba(170, 170, 170, 0.25)";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });

      ctx.beginPath();
      data.forEach((d, i) => {
        const x = toX(i), y = toY(parseFloat(d.y));
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = "rgba(255, 255, 255, 0.45)";
      ctx.lineWidth = 2.8;
      ctx.stroke();

      data.forEach((d, i) => {
        const x = toX(i), y = toY(parseFloat(d.y));
        ctx.fillStyle = fgiColor(parseFloat(d.y));
        ctx.beginPath();
        ctx.arc(x, y, 5.0, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    // Scriptable drawGauge 1:1 완벽 구현
    function drawGauge(canvasId, val) {
      const W = 320, H = 180;
      const cv = getHDContext(canvasId, W, H);
      if (!cv) return;
      const { ctx } = cv;

      const cx = W / 2, cy = H - 20, radius = 120, arcThick = 11;

      for (let i = 0; i < 120; i++) {
        const t = i / 119;
        const angle = Math.PI + t * Math.PI;
        const x = cx + Math.cos(angle) * radius;
        const y = cy + Math.sin(angle) * radius;
        ctx.fillStyle = fgiColor(t * 100);
        ctx.beginPath();
        ctx.arc(x, y, arcThick / 2, 0, Math.PI * 2);
        ctx.fill();
      }

      const needleAngle = Math.PI + (val / 100) * Math.PI;
      const needleLen = radius - 8;
      for (let i = 0; i < 35; i++) {
        const t = i / 34;
        const nx = cx + Math.cos(needleAngle) * needleLen * t;
        const ny = cy + Math.sin(needleAngle) * needleLen * t;
        const thick = 12 * (1 - t);
        ctx.fillStyle = C.p1;
        ctx.beginPath();
        ctx.arc(nx, ny, thick / 2, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = C.p1;
      ctx.beginPath();
      ctx.arc(cx, cy, 8, 0, Math.PI * 2);
      ctx.fill();

      const labelDist = radius + 22;
      const lx = cx + Math.cos(needleAngle) * labelDist;
      const ly = cy + Math.sin(needleAngle) * labelDist;
      ctx.fillStyle = C.p1;
      ctx.font = "bold 23px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(val.toFixed(0), lx, ly);
    }

    // Scriptable addToken 방식 토큰 렌더링
    function renderTokens(containerId, sig) {
      const el = document.getElementById(containerId);
      if (!el || !sig) return;

      let html = "";
      sig.lines.forEach(lineWords => {
        let tokensHtml = "";
        lineWords.forEach((token, idx) => {
          if (idx === 1) {
            tokensHtml += `<span class="token-action">${token}</span>`;
          } else if (sig.isAlert) {
            tokensHtml += `<span class="token-alert">${token}</span>`;
          } else if (token.includes("·")) {
            const parts = token.split("·");
            parts.forEach((part, i) => {
              tokensHtml += `<span class="${etfColorClass(part)}">${part}</span>`;
              if (i < parts.length - 1) tokensHtml += `<span class="token-dot">·</span>`;
            });
          } else {
            tokensHtml += `<span class="${etfColorClass(token)}">${token}</span>`;
          }
        });

        html += `<div class="sig-row">${tokensHtml}</div>`;
      });

      html += `
        <div class="status-text" style="color: ${sig.isAlert ? C.alert : 'var(--status-p)'}">${sig.n}</div>
        <div class="dd-text">${sig.ddStr}</div>
      `;
      el.innerHTML = html;
    }

    function applyViewFilter() {
      const urlParams = new URLSearchParams(window.location.search);
      const view = urlParams.get('v');

      const cardSpx = document.getElementById('card-spx');
      const cardQqq = document.getElementById('card-qqq');
      const cardFgi = document.getElementById('card-fgi');
      const btnRefresh = document.getElementById('btn-refresh');

      if (view) {
        document.body.classList.add('is-widget');
      }

      if (view === 'spx') {
        cardQqq.style.display = 'none';
        cardFgi.style.display = 'none';
        btnRefresh.style.display = 'none';
      } else if (view === 'qqq') {
        cardSpx.style.display = 'none';
        cardFgi.style.display = 'none';
        btnRefresh.style.display = 'none';
      } else if (view === 'fgi') {
        cardSpx.style.display = 'none';
        cardQqq.style.display = 'none';
        btnRefresh.style.display = 'none';
      }
    }

    async function loadDashboard() {
      const loader = document.getElementById("loader");
      const mainView = document.getElementById("main-view");
      loader.style.display = "flex";
      mainView.style.display = "none";

      try {
        const res = await fetch(WORKER_URL);
        if (!res.ok) throw new Error("지표 데이터를 가져올 수 없습니다.");
        const data = await res.json();

        const formatKSTTime = (ts) => {
          const d = new Date(ts * 1000);
          const kst = new Date(d.toLocaleString("en-US", { timeZone: "Asia/Seoul" }));
          const yy = String(kst.getFullYear()).slice(-2);
          const mm = String(kst.getMonth() + 1).padStart(2, '0');
          const dd = String(kst.getDate()).padStart(2, '0');
          const hh = String(kst.getHours()).padStart(2, '0');
          const min = String(kst.getMinutes()).padStart(2, '0');
          return `${yy}.${mm}.${dd}. ${hh}:${min} 기준`;
        };

        if (data.version) {
          document.getElementById("spx-ver").innerText = data.version;
          document.getElementById("qqq-ver").innerText = data.version;
        }

        document.getElementById("spx-updated").innerText = formatKSTTime(data.spxTime);
        document.getElementById("qqq-updated").innerText = formatKSTTime(data.qqqTime);

        // 200슨피단 (SPX ±2.5% 밴드)
        drawBandChart("spxChart", data.spx.closes, data.spx.sma, 0.025, 0.025);
        renderTokens("spx-info", data.spx.sig);

        // 200큐큐단 (QQQ ±2.0% 밴드)
        drawBandChart("qqqChart", data.qqq.closes, data.qqq.sma, 0.02, 0.02);
        renderTokens("qqq-info", data.qqq.sig);

        // 공포와 탐욕 지수 (CNN FGI)
        drawFGIChart("fgiHistoryChart", data.fgi.data);
        drawGauge("fgiGauge", data.fgi.latestVal);

        const ratingEl = document.getElementById("fgi-rating-text");
        ratingEl.innerText = translateRating(data.fgi.latestRating);
        ratingEl.style.color = fgiColor(data.fgi.latestVal);

        const statsEl = document.getElementById("fgi-stats-text");
        statsEl.innerHTML = `
          <span style="color: ${fgiColor(data.fgi.latestVal)}">현재 ${data.fgi.latestVal.toFixed(0)}</span>
          <span class="fgi-slash"> / </span>
          <span style="color: ${fgiColor(data.fgi.avg30)}">30일 평균 ${data.fgi.avg30.toFixed(0)}</span>
        `;

        applyViewFilter();

        loader.style.display = "none";
        mainView.style.display = "flex";
      } catch (err) {
        loader.innerText = "오류: " + err.message;
      }
    }

    loadDashboard();
  </script>
</body>
</html>
