name: Build Android APK (200SPX)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Capacitor Project (Live GitHub Pages Sync)
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "200SPX" "com.core0x7f.spx200" --web-dir="www"

          node -e '
          const fs = require("fs");
          let cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
          cfg.server = { "url": "https://0x7f-core.github.io/200SPX/", "cleartext": true };
          fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '

          npx cap add android
          npx cap sync android

      - name: Set App Name to 200SPX
        run: |
          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">200SPX</string>
              <string name="title_activity_main">200SPX</string>
              <string name="package_name">com.core0x7f.spx200</string>
              <string name="custom_url_scheme">com.core0x7f.spx200</string>
          </resources>
          EOF

      - name: Apply Custom App Icon (icon.png)
        run: |
          if [ -f "icon.png" ]; then
            echo "Installing ImageMagick..."
            sudo apt-get update && sudo apt-get install -y imagemagick

            for size in 48:mdpi 72:hdpi 96:xhdpi 144:xxhdpi 192:xxxhdpi; do
              dim="${size%%:*}"
              res="${size##*:}"
              mkdir -p "android/app/src/main/res/mipmap-${res}"
              convert icon.png -resize "${dim}x${dim}" -gravity center -extent "${dim}x${dim}" "android/app/src/main/res/mipmap-${res}/ic_launcher.png"
              convert icon.png -resize "${dim}x${dim}" -gravity center -extent "${dim}x${dim}" "android/app/src/main/res/mipmap-${res}/ic_launcher_round.png"
            done

            for size in 108:mdpi 162:hdpi 216:xhdpi 324:xxhdpi 432:xxxhdpi; do
              dim="${size%%:*}"
              res="${size##*:}"
              mkdir -p "android/app/src/main/res/mipmap-${res}"
              inner_dim=$(awk "BEGIN {printf \"%d\", $dim * 0.72}")
              convert icon.png -resize "${inner_dim}x${inner_dim}" -gravity center -background none -extent "${dim}x${dim}" "android/app/src/main/res/mipmap-${res}/ic_launcher_foreground.png"
            done
          fi

      - name: Inject Ultra-Fast Responsive Android Widgets
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat << 'EOF' > android/app/src/main/res/drawable/ic_refresh.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#AAAAAA"
                  android:pathData="M17.65,6.35C16.2,4.9 14.21,4 12,4c-4.42,0 -7.99,3.58 -7.99,8s3.57,8 7.99,8c3.73,0 6.84,-2.55 7.73,-6h-2.08c-0.82,2.33 -3.04,4 -5.65,4 -3.31,0 -6,-2.69 -6,-6s2.69,-6 6,-6c1.66,0 3.14,0.69 4.22,1.78L13,11h7V4l-2.35,2.35z"/>
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/bg_refresh_circle.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#CC18181A" />
              <stroke android:width="1dp" android:color="#33FFFFFF" />
          </shape>
          EOF

          mkdir -p android/app/src/main/res/layout
          cat << 'EOF' > android/app/src/main/res/layout/spx_widget_layout.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">
              <ImageView
                  android:id="@+id/widget_image"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="fitXY" />
              <ImageView
                  android:id="@+id/btn_refresh"
                  android:layout_width="28dp"
                  android:layout_height="28dp"
                  android:layout_alignParentEnd="true"
                  android:layout_alignParentBottom="true"
                  android:layout_marginEnd="6dp"
                  android:layout_marginBottom="6dp"
                  android:background="@drawable/bg_refresh_circle"
                  android:padding="5dp"
                  android:src="@drawable/ic_refresh"
                  android:contentDescription="새로고침" />
          </RelativeLayout>
          EOF

          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/widget_spx_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="110dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/spx_widget_layout"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          cat << 'EOF' > android/app/src/main/res/xml/widget_qqq_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="110dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/spx_widget_layout"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          cat << 'EOF' > android/app/src/main/res/xml/widget_fgi_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="110dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/spx_widget_layout"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          mkdir -p android/app/src/main/java/com/core0x7f/spx200
          cat << 'EOF' > android/app/src/main/java/com/core0x7f/spx200/BaseWidgetProvider.java
          package com.core0x7f.spx200;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.content.Intent;
          import android.content.res.Configuration;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.DisplayMetrics;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.RemoteViews;

          import java.util.Calendar;
          import java.util.TimeZone;

          public abstract class BaseWidgetProvider extends AppWidgetProvider {
              protected abstract String getUrl();
              public static final String ACTION_MANUAL_REFRESH = "com.core0x7f.spx200.MANUAL_REFRESH";

              // 미국 뉴욕 정규장 시간 + 장 마감 후 정산 45분 (월~금 09:30 ~ 16:45, 서머타임 자동 계산)
              private boolean isUsMarketOpen() {
                  try {
                      Calendar cal = Calendar.getInstance(TimeZone.getTimeZone("America/New_York"));
                      int day = cal.get(Calendar.DAY_OF_WEEK);
                      if (day == Calendar.SATURDAY || day == Calendar.SUNDAY) {
                          return false; // 주말 장외
                      }
                      int minuteOfDay = cal.get(Calendar.HOUR_OF_DAY) * 60 + cal.get(Calendar.MINUTE);
                      return minuteOfDay >= (9 * 60 + 30) && minuteOfDay <= (16 * 60 + 45); // 09:30 ~ 16:45 (정산 완료)
                  } catch (Exception e) {
                      return true;
                  }
              }

              @Override
              public void onReceive(Context context, Intent intent) {
                  super.onReceive(context, intent);
                  if (ACTION_MANUAL_REFRESH.equals(intent.getAction())) {
                      AppWidgetManager mgr = AppWidgetManager.getInstance(context);
                      int[] ids = intent.getIntArrayExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS);
                      if (ids != null) {
                          for (int id : ids) updateAppWidget(context, mgr, id);
                      }
                  }
              }

              @Override
              public void onUpdate(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds) {
                  // 시스템 30분 자동 알람: 정규장 + 종가 정산 시간이 아닐 경우 배터리 소모 0으로 건너뜀
                  if (!isUsMarketOpen()) {
                      return;
                  }
                  for (int id : appWidgetIds) {
                      updateAppWidget(context, appWidgetManager, id);
                  }
              }

              @Override
              public void onAppWidgetOptionsChanged(Context context, AppWidgetManager appWidgetManager, int id, Bundle options) {
                  updateAppWidget(context, appWidgetManager, id);
                  super.onAppWidgetOptionsChanged(context, appWidgetManager, id, options);
              }

              private void updateAppWidget(Context context, AppWidgetManager appWidgetManager, int appWidgetId) {
                  new Handler(Looper.getMainLooper()).post(() -> {
                      try {
                          Bundle options = appWidgetManager.getAppWidgetOptions(appWidgetId);
                          DisplayMetrics dm = context.getResources().getDisplayMetrics();
                          
                          int widthDp = 460, heightDp = 180;
                          if (options != null) {
                              int orientation = context.getResources().getConfiguration().orientation;
                              if (orientation == Configuration.ORIENTATION_LANDSCAPE) {
                                  int w = options.getInt(AppWidgetManager.OPTION_APPWIDGET_MAX_WIDTH, 0);
                                  int h = options.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_HEIGHT, 0);
                                  if (w > 0) widthDp = w; if (h > 0) heightDp = h;
                              } else {
                                  int w = options.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH, 0);
                                  int h = options.getInt(AppWidgetManager.OPTION_APPWIDGET_MAX_HEIGHT, 0);
                                  if (w > 0) widthDp = w; if (h > 0) heightDp = h;
                              }
                          }

                          float scale = Math.max(dm.density * 1.35f, 3.5f);
                          int widthPx = Math.max((int) (widthDp * scale), 900);
                          int heightPx = Math.max((int) (heightDp * scale), 360);

                          WebView webView = new WebView(context.getApplicationContext());
                          webView.setBackgroundColor(0xFF000000);
                          webView.setLayerType(View.LAYER_TYPE_SOFTWARE, null);

                          WebSettings settings = webView.getSettings();
                          settings.setJavaScriptEnabled(true);
                          settings.setDomStorageEnabled(true);
                          settings.setDatabaseEnabled(true);
                          settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                          webView.measure(
                              View.MeasureSpec.makeMeasureSpec(widthPx, View.MeasureSpec.EXACTLY),
                              View.MeasureSpec.makeMeasureSpec(heightPx, View.MeasureSpec.EXACTLY)
                          );
                          webView.layout(0, 0, widthPx, heightPx);

                          Runnable doCapture = () -> {
                              try {
                                  Bitmap bitmap = Bitmap.createBitmap(widthPx, heightPx, Bitmap.Config.ARGB_8888);
                                  Canvas canvas = new Canvas(bitmap);
                                  canvas.drawColor(0xFF000000);
                                  webView.draw(canvas);

                                  RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.spx_widget_layout);
                                  views.setImageViewBitmap(R.id.widget_image, bitmap);

                                  Intent appIntent = new Intent(context, MainActivity.class);
                                  views.setOnClickPendingIntent(
                                      R.id.widget_image,
                                      PendingIntent.getActivity(context, 0, appIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE)
                                  );

                                  Intent refreshIntent = new Intent(context, BaseWidgetProvider.this.getClass());
                                  refreshIntent.setAction(ACTION_MANUAL_REFRESH);
                                  refreshIntent.putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS, new int[]{appWidgetId});
                                  views.setOnClickPendingIntent(
                                      R.id.btn_refresh,
                                      PendingIntent.getBroadcast(context, appWidgetId, refreshIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE)
                                  );

                                  appWidgetManager.updateAppWidget(appWidgetId, views);
                              } catch (Exception ignored) {}
                          };

                          webView.addJavascriptInterface(new Object() {
                              @JavascriptInterface
                              public void onRenderComplete() {
                                  new Handler(Looper.getMainLooper()).postDelayed(doCapture, 30);
                              }
                          }, "AndroidBridge");

                          new Handler(Looper.getMainLooper()).postDelayed(doCapture, 2000);
                          webView.loadUrl(getUrl());
                      } catch (Exception ignored) {}
                  });
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/java/com/core0x7f/spx200/SPXWidgetProvider.java
          package com.core0x7f.spx200;
          public class SPXWidgetProvider extends BaseWidgetProvider {
              @Override
              protected String getUrl() {
                  return "https://0x7f-core.github.io/200SPX/?v=spx";
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/java/com/core0x7f/spx200/QQQWidgetProvider.java
          package com.core0x7f.spx200;
          public class QQQWidgetProvider extends BaseWidgetProvider {
              @Override
              protected String getUrl() {
                  return "https://0x7f-core.github.io/200SPX/?v=qqq";
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/java/com/core0x7f/spx200/FGIWidgetProvider.java
          package com.core0x7f.spx200;
          public class FGIWidgetProvider extends BaseWidgetProvider {
              @Override
              protected String getUrl() {
                  return "https://0x7f-core.github.io/200SPX/?v=fgi";
              }
          }
          EOF

          node -e '
          const fs = require("fs");
          const file = "android/app/src/main/AndroidManifest.xml";
          let content = fs.readFileSync(file, "utf8");
          const receivers = `
                  <receiver android:name=".SPXWidgetProvider" android:label="200슨피단 (SPX)" android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="com.core0x7f.spx200.MANUAL_REFRESH" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_spx_info" />
                  </receiver>
                  <receiver android:name=".QQQWidgetProvider" android:label="200큐큐단 (QQQ)" android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="com.core0x7f.spx200.MANUAL_REFRESH" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_qqq_info" />
                  </receiver>
                  <receiver android:name=".FGIWidgetProvider" android:label="공포와 탐욕 지수 (CNN FGI)" android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="com.core0x7f.spx200.MANUAL_REFRESH" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_fgi_info" />
                  </receiver>
          `;
          content = content.replace("</application>", receivers + "\n    </application>");
          fs.writeFileSync(file, content);
          '

          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 200SPX-Optimized-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
