name: Build Android APK with 3 Widgets

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Capacitor Project
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "200SPX" "com.jinwook.spx200" --web-dir="www"
          npx cap add android
          npx cap sync android

      - name: Inject 3 Individual Android Widgets
        run: |
          # 1. 공통 위젯 레이아웃 XML 생성
          mkdir -p android/app/src/main/res/layout
          cat << 'EOF' > android/app/src/main/res/layout/spx_widget_layout.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">
              <ImageView
                  android:id="@+id/widget_image"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="fitCenter" />
          </RelativeLayout>
          EOF

          # 2. 위젯 3종 메타데이터 XML 생성
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/widget_spx_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="110dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/spx_widget_layout"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          cat << 'EOF' > android/app/src/main/res/xml/widget_qqq_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="110dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/spx_widget_layout"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          cat << 'EOF' > android/app/src/main/res/xml/widget_fgi_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="110dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/spx_widget_layout"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          # 3. 위젯 3종 백그라운드 엔진 및 Provider Java 코드 생성
          mkdir -p android/app/src/main/java/com/jinwook/spx200
          cat << 'EOF' > android/app/src/main/java/com/jinwook/spx200/BaseWidgetProvider.java
          package com.jinwook.spx200;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.RemoteViews;

          public abstract class BaseWidgetProvider extends AppWidgetProvider {
              protected abstract String getUrl();

              @Override
              public void onUpdate(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds) {
                  for (int appWidgetId : appWidgetIds) {
                      updateAppWidget(context, appWidgetManager, appWidgetId);
                  }
              }

              private void updateAppWidget(Context context, AppWidgetManager appWidgetManager, int appWidgetId) {
                  new Handler(Looper.getMainLooper()).post(() -> {
                      try {
                          WebView webView = new WebView(context.getApplicationContext());
                          WebSettings settings = webView.getSettings();
                          settings.setJavaScriptEnabled(true);
                          settings.setDomStorageEnabled(true);
                          settings.setCacheMode(WebSettings.LOAD_NO_CACHE);

                          int width = 1080;
                          int height = 460;
                          webView.measure(
                              View.MeasureSpec.makeMeasureSpec(width, View.MeasureSpec.EXACTLY),
                              View.MeasureSpec.makeMeasureSpec(height, View.MeasureSpec.EXACTLY)
                          );
                          webView.layout(0, 0, width, height);

                          webView.setWebViewClient(new WebViewClient() {
                              @Override
                              public void onPageFinished(WebView view, String url) {
                                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                                      try {
                                          Bitmap bitmap = Bitmap.createBitmap(width, height, Bitmap.Config.ARGB_8888);
                                          Canvas canvas = new Canvas(bitmap);
                                          view.draw(canvas);

                                          RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.spx_widget_layout);
                                          views.setImageViewBitmap(R.id.widget_image, bitmap);

                                          Intent intent = new Intent(context, MainActivity.class);
                                          PendingIntent pendingIntent = PendingIntent.getActivity(
                                              context, 0, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                                          );
                                          views.setOnClickPendingIntent(R.id.widget_root, pendingIntent);

                                          appWidgetManager.updateAppWidget(appWidgetId, views);
                                      } catch (Exception ignored) {}
                                  }, 1200);
                              }
                          });

                          webView.loadUrl(getUrl());
                      } catch (Exception ignored) {}
                  });
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/java/com/jinwook/spx200/SPXWidgetProvider.java
          package com.jinwook.spx200;
          public class SPXWidgetProvider extends BaseWidgetProvider {
              @Override
              protected String getUrl() {
                  return "https://jinwook0904.github.io/200SPX/?v=spx";
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/java/com/jinwook/spx200/QQQWidgetProvider.java
          package com.jinwook.spx200;
          public class QQQWidgetProvider extends BaseWidgetProvider {
              @Override
              protected String getUrl() {
                  return "https://jinwook0904.github.io/200SPX/?v=qqq";
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/java/com/jinwook/spx200/FGIWidgetProvider.java
          package com.jinwook.spx200;
          public class FGIWidgetProvider extends BaseWidgetProvider {
              @Override
              protected String getUrl() {
                  return "https://jinwook0904.github.io/200SPX/?v=fgi";
              }
          }
          EOF

          # 4. AndroidManifest.xml에 3개 위젯 리시버 등록
          node -e '
          const fs = require("fs");
          const file = "android/app/src/main/AndroidManifest.xml";
          let content = fs.readFileSync(file, "utf8");
          const receivers = `
                  <receiver android:name=".SPXWidgetProvider" android:label="200슨피단 (SPX)" android:exported="true">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_spx_info" />
                  </receiver>
                  <receiver android:name=".QQQWidgetProvider" android:label="200큐큐단 (QQQ)" android:exported="true">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_qqq_info" />
                  </receiver>
                  <receiver android:name=".FGIWidgetProvider" android:label="공포와 탐욕 지수 (CNN FGI)" android:exported="true">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_fgi_info" />
                  </receiver>
          `;
          content = content.replace("</application>", receivers + "\n    </application>");
          fs.writeFileSync(file, content);
          '

          # 5. Kotlin 중복 충돌 방지 패치
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 200SPX-3Widgets-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
