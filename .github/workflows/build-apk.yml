name: Build Android APK with Widget

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Capacitor Project
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "200SPX" "com.jinwook.spx200" --web-dir="www"
          npx cap add android
          npx cap sync android

      - name: Inject Native Android Widget Code
        run: |
          # 1. 위젯 레이아웃 XML 생성
          mkdir -p android/app/src/main/res/layout
          cat << 'EOF' > android/app/src/main/res/layout/spx_widget_layout.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">
              <ImageView
                  android:id="@+id/widget_image"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="fitCenter" />
          </RelativeLayout>
          EOF

          # 2. 위젯 메타데이터 XML 생성
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/spx_widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="140dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/spx_widget_layout"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          # 3. 백그라운드 웹 스냅샷 AppWidgetProvider Java 코드 생성
          mkdir -p android/app/src/main/java/com/jinwook/spx200
          cat << 'EOF' > android/app/src/main/java/com/jinwook/spx200/SPXWidgetProvider.java
          package com.jinwook.spx200;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.RemoteViews;

          public class SPXWidgetProvider extends AppWidgetProvider {

              @Override
              public void onUpdate(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds) {
                  for (int appWidgetId : appWidgetIds) {
                      updateAppWidget(context, appWidgetManager, appWidgetId);
                  }
              }

              private void updateAppWidget(Context context, AppWidgetManager appWidgetManager, int appWidgetId) {
                  new Handler(Looper.getMainLooper()).post(() -> {
                      try {
                          WebView webView = new WebView(context.getApplicationContext());
                          WebSettings settings = webView.getSettings();
                          settings.setJavaScriptEnabled(true);
                          settings.setDomStorageEnabled(true);
                          settings.setCacheMode(WebSettings.LOAD_NO_CACHE);

                          int width = 1080;
                          int height = 700;
                          webView.measure(
                              View.MeasureSpec.makeMeasureSpec(width, View.MeasureSpec.EXACTLY),
                              View.MeasureSpec.makeMeasureSpec(height, View.MeasureSpec.EXACTLY)
                          );
                          webView.layout(0, 0, width, height);

                          webView.setWebViewClient(new WebViewClient() {
                              @Override
                              public void onPageFinished(WebView view, String url) {
                                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                                      try {
                                          Bitmap bitmap = Bitmap.createBitmap(width, height, Bitmap.Config.ARGB_8888);
                                          Canvas canvas = new Canvas(bitmap);
                                          view.draw(canvas);

                                          RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.spx_widget_layout);
                                          views.setImageViewBitmap(R.id.widget_image, bitmap);

                                          // 위젯 터치 시 앱 실행
                                          Intent intent = new Intent(context, MainActivity.class);
                                          PendingIntent pendingIntent = PendingIntent.getActivity(
                                              context, 0, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                                          );
                                          views.setOnClickPendingIntent(R.id.widget_root, pendingIntent);

                                          appWidgetManager.updateAppWidget(appWidgetId, views);
                                      } catch (Exception ignored) {}
                                  }, 1200);
                              }
                          });

                          webView.loadUrl("https://jinwook0904.github.io/200SPX/");
                      } catch (Exception ignored) {}
                  });
              }
          }
          EOF

          # 4. AndroidManifest.xml에 위젯 리시버 등록
          sed -i '/<\/application>/i \
                  <receiver android:name=".SPXWidgetProvider" android:exported="true"> \
                      <intent-filter> \
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" /> \
                      </intent-filter> \
                      <meta-data \
                          android:name="android.appwidget.provider" \
                          android:resource="@xml/spx_widget_info" /> \
                  </receiver>' android/app/src/main/AndroidManifest.xml

          # 5. Kotlin 라이브러리 중복 충돌 방지 패치
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 200SPX-app-with-widget
          path: android/app/build/outputs/apk/debug/app-debug.apk
